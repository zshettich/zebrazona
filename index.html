<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZebraZóna - Biztonságos közlekedés</title>
    <style>
        :root {
            --asphalt: #333333;
            --road-line: #ffffff;
            --sign-red: #ff0000;
            --sign-blue: #0055ff;
            --sign-yellow: #ffdb00;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', sans-serif;
            background-color: var(--asphalt);
            /* Aszfalt textúra és útburkolati jel */
            background-image: 
                linear-gradient(90deg, transparent 48%, var(--road-line) 49%, var(--road-line) 51%, transparent 52%),
                radial-gradient(#444 15%, transparent 16%);
            background-size: 100% 100px, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 50px;
            border: 8px solid var(--road-line);
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
            position: relative;
        }

        /* Zebra minta a cím alatt */
        .zebra-divider {
            height: 30px;
            background: repeating-linear-gradient(
                90deg,
                #fff,
                #fff 20px,
                #000 20px,
                #000 40px
            );
            margin: 20px 0;
            border: 2px solid #fff;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            text-transform: uppercase;
            text-shadow: 3px 3px 0px var(--sign-blue);
        }

        .subtitle {
            font-family: 'Segoe UI', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: var(--sign-yellow);
        }

        .menu-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            background: var(--sign-blue);
            color: white;
            border: 4px solid white;
            padding: 20px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-quiz {
            background: #228b22; /* Közlekedési zöld */
        }

        .btn:hover {
            transform: scale(1.1) rotate(-2deg);
            background: var(--sign-yellow);
            color: black;
        }

        /* Közlekedési lámpa dekoráció */
        .traffic-light {
            position: absolute;
            top: -40px;
            right: -30px;
            background: #222;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #555;
        }
        .light {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 5px 0;
        }
        .red { background: red; box-shadow: 0 0 10px red; }
        .yellow { background: yellow; }
        .green { background: #00ff00; }

    </style>
</head>
<body>

    <div class="container">
        <div class="traffic-light">
            <div class="light red"></div>
            <div class="light yellow"></div>
            <div class="light green"></div>
        </div>

        <h1>ZebraZóna</h1>
        <div class="zebra-divider"></div>
        <div class="subtitle">Közlekedj okosan, érj haza épségben!</div>

        <div class="menu-grid">
            <a href="#" class="btn btn-quiz">INDUL AZ OKTATÁS!</a>
        </div>

        <div style="margin-top: 30px; font-family: sans-serif; font-size: 0.9rem; opacity: 0.7;">
            Használd a tudásod a biztonságos közlekedéshez!
        </div>
    </div>

</body>
</html>
